<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Error</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    img {
      display: block;
      width: min(100vw, 1536px);
      height: auto;
      max-height: 100vh;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">Server error</h1>
    <p class="sr-only">The machine has encountered turbulence. Please try again shortly.</p>
    <img
      src="/_error/assets/50x.png"
      width="1536"
      height="1024"
      alt="5xx: The machine has encountered turbulence. Please try again shortly."
    >
  </main>
</body>
</html>
